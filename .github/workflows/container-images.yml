name: Container images

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/web/**
      - infrastructure/caddy/**
      - infrastructure/keycloak/**
      - infrastructure/postgres/**
      - .github/workflows/container-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run API test image
        run: docker build --target test --tag cms-erp-api-test apps/api

  build:
    name: Build ${{ matrix.name }}
    needs: api-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: gateway
            context: infrastructure/caddy
            dockerfile: infrastructure/caddy/Dockerfile.portainer
          - name: keycloak
            context: infrastructure/keycloak
            dockerfile: infrastructure/keycloak/Dockerfile.portainer
          - name: postgres
            context: infrastructure/postgres
            dockerfile: infrastructure/postgres/Dockerfile.portainer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cms-erp-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=0.3.3a
            APP_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
