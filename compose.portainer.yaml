# Portainer: Diese Datei als Stack verwenden. APP_ORIGIN muss der von den
# Browsern erreichbaren Adresse entsprechen, z. B. http://192.168.1.20:8090.
services:
  gateway:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-adwes1}/cms-erp-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-adwes1}/cms-erp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-adwes1}/cms-erp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms_erp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@postgres:5432/${POSTGRES_DB:-cms_erp}?schema=public
      OIDC_ISSUER: ${APP_ORIGIN:?APP_ORIGIN muss gesetzt sein}/auth/realms/cms-erp
      OIDC_JWKS_URI: http://keycloak:8080/auth/realms/cms-erp/protocol/openid-connect/certs
      OIDC_CLIENT_ID: cms-erp-web
      OIDC_REQUIRED_ROLE: cms-erp-user
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: cms-erp
      KEYCLOAK_API_CLIENT_ID: cms-erp-api
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:?KEYCLOAK_API_CLIENT_SECRET muss gesetzt sein}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY muss gesetzt sein}
      ARTICLE_IMAGE_DIR: /app/data/article-images
      BACKUP_DIR: /app/data/backups
      PORT: 3000
    volumes:
      # Dauerhafte Anwendungsdaten auf der Synology
      - /volume1/docker/CMS_ERP/article-images:/app/data/article-images
      - /volume1/docker/CMS_ERP/backups:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 15

  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-adwes1}/cms-erp-postgres:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_erp}
      POSTGRES_USER: ${POSTGRES_USER:-cms_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      # PostgreSQL 18 speichert seine Daten unter /var/lib/postgresql.
      - /volume1/docker/CMS_ERP/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms_erp} -d ${POSTGRES_DB:-cms_erp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-adwes1}/cms-erp-keycloak:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cms_erp}
      KC_DB_USERNAME: ${POSTGRES_USER:-cms_erp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${APP_ORIGIN:?APP_ORIGIN muss gesetzt sein}/auth
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD muss gesetzt sein}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak-config:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-adwes1}/cms-erp-keycloak:${IMAGE_TAG:-latest}
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/cms-erp/configure.sh"]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN muss gesetzt sein}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD muss gesetzt sein}
      KEYCLOAK_APP_ADMIN_PASSWORD: ${KEYCLOAK_APP_ADMIN_PASSWORD:?KEYCLOAK_APP_ADMIN_PASSWORD muss gesetzt sein}
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:?KEYCLOAK_API_CLIENT_SECRET muss gesetzt sein}
    depends_on:
      keycloak:
        condition: service_healthy
